services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: journalism
      POSTGRES_USER: journalism
      POSTGRES_PASSWORD: journalism
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U journalism -d journalism']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - journalism_postgres:/var/lib/postgresql/data

volumes:
  journalism_postgres:
